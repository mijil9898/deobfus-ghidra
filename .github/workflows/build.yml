# Giai đoạn 3: DevSecOps Pipeline Tối Ưu & An Toàn 
# (Buildx GHA Cache, Trivy DB Cache, Security Traceability GHCR Publish, Dependabot Sync)
name: devsecops-pipeline

on:
  push:
  workflow_dispatch:

# Quyền tối thiểu ở cấp workflow: chỉ đọc code.
permissions:
  contents: read

jobs:
  sast_semgrep:
    name: "Semgrep SAST (Code Analysis)"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run Semgrep Security Gate
        # Quét SAST mã nguồn, dừng pipeline (exit 1) ở mọi mức phát hiện (--error)
        run: |
          docker run --rm -v "${PWD}:/src" returntocorp/semgrep:latest \
            semgrep scan --config "p/python" --config "p/security-audit" --error \
            --sarif-output /src/semgrep.sarif /src

      - name: Upload Semgrep SARIF Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: warn

  build_and_scan:
    name: "Build & Trivy Scan"
    needs: sast_semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Trivy Vulnerability Database
        # Lưu cache cơ sở dữ liệu Trivy DB để tránh tải lại ~119MB mỗi lần chạy (giảm ~2m30s)
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ hashFiles('.trivyignore.yaml') }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      - name: Build image (cache GHA)
        # Dùng docker/build-push-action với load: true để GHA cache hoạt động đúng chuẩn
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ghidra-deobf:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Xuất Docker Image ra Tarball (Security Traceability & Loại bỏ docker.sock)
        # Tăng cường an toàn: xuất image thành file tarball để quét Trivy và tái sử dụng khi publish
        run: docker save ghidra-deobf:ci -o /tmp/ghidra-deobf.tar

      - name: Upload Verified Docker Image Artifact
        # Lưu trữ artifact image đã kiểm định để công đoạn publish GHCR tải về push trực tiếp
        uses: actions/upload-artifact@v4
        with:
          name: verified-image-tarball
          path: /tmp/ghidra-deobf.tar

      - name: Trivy Vulnerability Scanner (Security Gate)
        # Quét lỗ hổng từ file tarball, dừng pipeline (exit 1) nếu có CVE mức HIGH hoặc CRITICAL
        shell: bash
        run: |
          set -o pipefail
          docker run --rm \
            -v "${PWD}:/workspace" \
            -v "/tmp/ghidra-deobf.tar:/tmp/ghidra-deobf.tar:ro" \
            -v "${HOME}/.cache/trivy:/root/.cache/trivy" \
            aquasec/trivy:0.55.2 image \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --ignorefile /workspace/.trivyignore.yaml \
            --input /tmp/ghidra-deobf.tar \
            --format table | tee trivy-report.txt

      - name: Upload Trivy Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt

      - name: Ghi phiên bản gói Python trong image (pip freeze)
        run: docker run --rm --entrypoint pip ghidra-deobf:ci freeze | tee pip-freeze.txt

      - name: Upload pip freeze Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pip-freeze
          path: pip-freeze.txt

      - name: Smoke test --help
        run: docker run --rm ghidra-deobf:ci --help

      - name: Functional test (--network none)
        # Chạy phân tích thật (JVM + PyGhidra) không mạng, so kết quả giải mã với giá trị mong đợi.
        run: |
          mkdir -p "${RUNNER_TEMP}/bins"
          gcc -O0 -o "${RUNNER_TEMP}/bins/xor_simple_O0" test_bins/xor_simple.c
          docker run --rm --network none \
            -v "${RUNNER_TEMP}/bins:/bins:ro" \
            ghidra-deobf:ci /bins/xor_simple_O0 > result.json 2> >(tee analysis.log >&2)
          python3 - <<'EOF'
          import json
          res = json.load(open("result.json"))["results"]
          # In và assert theo từng cặp (địa chỉ call -> chuỗi giải mã)
          mapping = {}
          for r in res:
              print(f"  {r.get('call_addr')}: [{r.get('status')}] {r.get('decoded')}")
              if r.get("status") == "ok":
                  mapping[r.get("call_addr")] = r.get("decoded")
          
          # Kiểm tra khớp 1-1 từng địa chỉ lời gọi với chuỗi mong đợi
          assert mapping.get("0x10120c") == "Hello", f"Giải mã sai tại 0x10120c: {mapping.get('0x10120c')}"
          assert mapping.get("0x101222") == "World", f"Giải mã sai tại 0x101222: {mapping.get('0x101222')}"
          assert mapping.get("0x101238") == "Secret", f"Giải mã sai tại 0x101238: {mapping.get('0x101238')}"
          print("[+] Kiểm thử ánh xạ địa chỉ -> chuỗi THÀNH CÔNG!")
          EOF

      - name: Chẩn đoán khi lỗi (dump C decompile của caller)
        # Chỉ chạy khi có analysis.log, tránh tự lỗi và che nguyên nhân thật của bước trước.
        if: failure() && hashFiles('analysis.log') != ''
        run: |
          addr="$(grep -oE '\* decode_xor @ 0x[0-9a-f]+' analysis.log | grep -oE '0x[0-9a-f]+' | head -1)"
          echo "Địa chỉ hàm giải mã: ${addr}"
          test -n "${addr}" || { echo "Không tìm thấy địa chỉ decode_xor trong analysis.log" | tee diag.log; exit 1; }
          chmod -R a+rwX "${RUNNER_TEMP}/bins"
          docker run --rm --network none \
            -v "${RUNNER_TEMP}/bins:/bins" \
            --entrypoint python3 ghidra-deobf:ci \
            /app/debug_pcode.py /bins/xor_simple_O0 "${addr}" 2>&1 | tee diag.log

      - name: Upload log chẩn đoán Artifact
        if: always() && (hashFiles('analysis.log') != '' || hashFiles('diag.log') != '')
        uses: actions/upload-artifact@v4
        with:
          name: functional-test-logs
          path: |
            analysis.log
            diag.log
            result.json
          if-no-files-found: ignore

      - name: Kiểm tra chạy non-root
        run: |
          uid="$(docker run --rm --entrypoint id ghidra-deobf:ci -u)"
          echo "uid trong container: $uid"
          test "$uid" != "0"

  publish_ghcr:
    name: "Publish to GHCR"
    needs: [sast_semgrep, build_and_scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download Verified Docker Image Artifact
        # Tải lại đúng file tarball image đã được quét Trivy và qua Functional test thành công
        uses: actions/download-artifact@v4
        with:
          name: verified-image-tarball
          path: /tmp

      - name: Load Verified Docker Image
        run: docker load -i /tmp/ghidra-deobf.tar

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and Push Verified Image to GHCR
        # Push trực tiếp image đã được kiểm định 100%, đảm bảo tính nhất quán tuyệt đối (Security Traceability)
        run: |
          IMAGE_ID="ghcr.io/${{ github.repository }}"
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          docker tag ghidra-deobf:ci "${IMAGE_ID}:latest"
          docker tag ghidra-deobf:ci "${IMAGE_ID}:${{ github.sha }}"
          docker push "${IMAGE_ID}:latest"
          docker push "${IMAGE_ID}:${{ github.sha }}"
