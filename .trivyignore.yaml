---
# Chấp nhận rủi ro có điều kiện cho các thư viện Java (Ghidra) và Python package.
# Điều kiện chung: image chỉ chạy phân tích cục bộ, không mở/kết nối mạng.
# Bằng chứng: bước CI "Functional test (--network none)" trong build.yml.
# Xem lại: 2027-10-01.
version: 1
vulnerabilities:
  # --- Java Libraries (Ghidra 12.1.4) ---
  - id: "CVE-2026-75595"
    statement: >-
      CVE-2026-75595 (Netty, ClientHello TLS bị phân mảnh). Chấp nhận bởi Mijil, 2026-10-06.
      Lý do: tool không mở cổng lắng nghe, chạy với --network none. Xem lại: 2027-10-01.
    expired_at: 2027-10-01T00:00:00Z
  - id: "CVE-2026-8763"
    statement: >-
      CVE-2026-8763 (BouncyCastle, bypass Name Constraints). Chấp nhận bởi Mijil, 2026-10-06.
      Lý do: tool không xác thực chứng chỉ X.509, không kết nối mạng. Xem lại: 2027-10-01.
    expired_at: 2027-10-01T00:00:00Z
  - id: "CVE-2026-13506"
    statement: >-
      CVE-2026-13506 (BouncyCastle, DoS ASN.1 sequence). Chấp nhận bởi Mijil, 2026-10-06.
      Lý do: tool không parse chứng chỉ ngoài, chạy non-root --network none. Xem lại: 2027-10-01.
    expired_at: 2027-10-01T00:00:00Z
  - id: "CVE-2026-44249"
    statement: >-
      CVE-2026-44249 (Netty, IPv6 subnet rule bypass). Chấp nhận bởi Mijil, 2026-10-06.
      Lý do: tool không dùng bộ lọc IP, không nhận kết nối mạng. Xem lại: 2027-10-01.
    expired_at: 2027-10-01T00:00:00Z
  - id: "CVE-2026-45416"
    statement: >-
      CVE-2026-45416 (Netty, TLS ClientHello memory allocation DoS). Chấp nhận bởi Mijil, 2026-10-06.
      Lý do: không có cổng lắng nghe TLS, --network none. Xem lại: 2027-10-01.
    expired_at: 2027-10-01T00:00:00Z
  - id: "CVE-2026-50010"
    statement: >-
      CVE-2026-50010 (Netty, Hostname verification bypass). Chấp nhận bởi Mijil, 2026-10-06.
      Lý do: tool không thực hiện kết nối TLS client. Xem lại: 2027-10-01.
    expired_at: 2027-10-01T00:00:00Z

  # --- Python Packages ---
  - id: "GHSA-6v7p-g79w-8964"
    statement: >-
      GHSA-6v7p-g79w-8964 (msgpack, crash/out-of-bounds read khi tái sử dụng Unpacker). Chấp nhận bởi Mijil, 2026-10-08.
      Lý do: tool CLI thực thi theo lượt độc lập, không giữ Unpacker state qua các phiên. Xem lại: 2027-10-01.
    expired_at: 2027-10-01T00:00:00Z
  - id: "CVE-2025-47273"
    statement: >-
      CVE-2025-47273 (setuptools, Path Traversal trong PackageIndex). Chấp nhận bởi Mijil, 2026-10-08.
      Lý do: setuptools chỉ dùng trong quá trình build image, container runtime không tải package mới. Xem lại: 2027-10-01.
    expired_at: 2027-10-01T00:00:00Z
  - id: "CVE-2026-97687"
    statement: >-
      CVE-2026-97687 (urllib3, Traffic interception via HTTPS proxy). Chấp nhận bởi Mijil, 2026-10-08.
      Lý do: tool chạy offline với --network none, không thực hiện HTTP proxy request. Xem lại: 2027-10-01.
    expired_at: 2027-10-01T00:00:00Z
  - id: "CVE-2026-97689"
    statement: >-
      CVE-2026-97689 (urllib3, DoS via memory allocation in chunk parser). Chấp nhận bởi Mijil, 2026-10-08.
      Lý do: container bị cô lập hoàn toàn mạng (--network none), không nhận/gửi HTTP stream. Xem lại: 2027-10-01.
    expired_at: 2027-10-01T00:00:00Z
